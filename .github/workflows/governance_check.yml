name: Governance Integrity Check

on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      - name: Install dependencies
        run: pip install streamlit pandas numpy
      - name: Run Integrity Tests
        run: python -c "import governance; print('Governance Logic Verified')"
name: Governance Integrity Check
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Debug Structure
        run: |
          echo "Checking folder contents:"
          ls -R
      - name: Run Script
        run: |
          python3 docs/governance.py
